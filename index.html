<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Интерактивный проект об энергетике: виды энергии, видео, конспекты и профессии отрасли.">
<title>РУСГИДРО — Энергия, которая движет будущее</title>
<link rel="icon" href="logo.png">
<style>
/* ============ ПЕРЕМЕННЫЕ / ТЕМЫ ============ */
:root{
  --blue:#0066A6; --dark:#003B63; --cyan:#29B6E6; --orange:#E66A25;
  --bg:#ffffff; --bg-alt:#f2fafd; --surface:#ffffff; --surface-2:#eef8fc;
  --text:#20313f; --muted:#5f7280; --border:#dcebf3;
  --header-bg:rgba(255,255,255,.82);
  --shadow:0 10px 30px rgba(0,59,99,.08);
  --shadow-lg:0 26px 60px rgba(0,59,99,.16);
}
html[data-theme="dark"]{
  --bg:#04121d; --bg-alt:#071c2b; --surface:#0a2233; --surface-2:#0d2b40;
  --text:#e3f2fa; --muted:#93b0c2; --border:#12334a;
  --header-bg:rgba(4,18,29,.8);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-lg:0 26px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  margin:0;font-family:"Segoe UI","Inter",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background-color .45s ease,color .45s ease;
}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{line-height:1.1}
img,svg{display:block}

/* ============ ПРОГРЕСС + HEADER ============ */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:300;
  background:linear-gradient(90deg,var(--blue),var(--cyan),var(--orange));
  box-shadow:0 0 14px rgba(41,182,230,.85);transition:width .1s linear}

header{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:11px clamp(16px,5vw,60px);
  background:var(--header-bg);backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid var(--border);transition:box-shadow .35s,background .4s,border-color .4s}
header.scrolled{box-shadow:0 10px 34px rgba(0,59,99,.10)}

.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:46px;height:46px;flex:0 0 auto;display:grid;place-items:center;
  transition:transform .4s cubic-bezier(.2,.8,.3,1)}
.brand:hover .brand-mark{transform:scale(1.06) rotate(-4deg)}
.brand-logo{width:100%;height:100%;object-fit:contain;display:block}
.brand-name{display:block;font-weight:900;font-size:19px;letter-spacing:.6px;color:var(--blue);line-height:1.15}
html[data-theme="dark"] .brand-name{color:#7fd4f5}
.brand-sub{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.2px}

nav{display:flex;gap:4px;align-items:center}
nav a{position:relative;font-size:13px;font-weight:700;color:var(--muted);
  padding:9px 11px;border-radius:10px;transition:color .25s,background .25s}
nav a:hover{color:var(--blue);background:var(--surface-2)}
html[data-theme="dark"] nav a:hover{color:#7fd4f5}
nav a.active{color:var(--blue)}
html[data-theme="dark"] nav a.active{color:#7fd4f5}
nav a.active::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:2px;
  border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--orange))}

.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);display:grid;place-items:center;font-size:16px;
  transition:transform .25s,border-color .25s,background .25s}
.icon-btn:hover{transform:translateY(-2px);border-color:rgba(41,182,230,.6)}
.burger{display:none}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:13px;
  font-size:13.5px;font-weight:800;border:0;transition:transform .28s,box-shadow .28s,background .28s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;
  box-shadow:0 12px 28px rgba(0,102,166,.30)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(0,102,166,.42)}
.btn-accent{background:linear-gradient(135deg,#E66A25,#ff9248);color:#fff;
  box-shadow:0 14px 34px rgba(230,106,37,.38)}
.btn-accent:hover{transform:translateY(-3px);box-shadow:0 20px 44px rgba(230,106,37,.5)}
.btn-ghost{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.38);
  backdrop-filter:blur(8px)}
.btn-ghost:hover{background:rgba(255,255,255,.20);transform:translateY(-3px)}

/* ============ HERO ============ */
.hero{position:relative;overflow:hidden;isolation:isolate;color:#fff;
  padding:clamp(64px,9vw,110px) clamp(18px,6vw,70px) clamp(130px,17vw,210px);
  background:radial-gradient(1200px 700px at 12% 8%,#0a4f7a 0%,transparent 60%),
             linear-gradient(140deg,#00263f 0%,#003B63 38%,#005f92 68%,#0a86b8 100%)}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;
  background:radial-gradient(620px 420px at 86% 12%,rgba(41,182,230,.40),transparent 70%),
             radial-gradient(520px 420px at 6% 92%,rgba(230,106,37,.26),transparent 70%)}
.hero-canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:min(44vh,330px);
  z-index:-1;opacity:.9;pointer-events:none}
.hero-inner{max-width:1180px;margin:0 auto;position:relative}

.kicker{display:inline-flex;align-items:center;gap:10px;font-size:10.5px;font-weight:800;
  letter-spacing:2.6px;color:#a9e6fb;padding:9px 16px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.20);
  animation:fadeUp .9s both}
.kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ee1a0;
  box-shadow:0 0 0 0 rgba(78,225,160,.7);animation:pulse 2.2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(78,225,160,0)}100%{box-shadow:0 0 0 0 rgba(78,225,160,0)}}

.hero h1{font-size:clamp(40px,8.2vw,86px);margin:22px 0 0;font-weight:900;
  letter-spacing:-2.5px;line-height:.94;animation:fadeUp .9s .1s both}
.hero h1 .grad{
  background:linear-gradient(100deg,#7fe7ff 0%,#ffffff 38%,#ffb27a 72%,#7fe7ff 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite}
@keyframes shine{to{background-position:220% 0}}
.hero p{max-width:640px;margin:24px 0 0;color:#d3eaf6;font-size:clamp(14.5px,1.5vw,17px);
  animation:fadeUp .9s .2s both}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;animation:fadeUp .9s .3s both}

.hero-stats{display:flex;flex-wrap:wrap;gap:clamp(22px,5vw,56px);margin-top:52px;
  animation:fadeUp .9s .42s both}
.hero-stats b{display:block;font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1;
  background:linear-gradient(120deg,#8fe8ff,#ffffff);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero-stats span{display:block;margin-top:7px;font-size:11.5px;color:#9fc5d9;
  letter-spacing:.6px;text-transform:uppercase;font-weight:700}

@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.scroll-hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:2;
  width:26px;height:42px;border:2px solid rgba(255,255,255,.45);border-radius:14px}
.scroll-hint::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;
  margin-left:-2px;border-radius:3px;background:#fff;animation:wheel 1.8s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}35%{opacity:1}100%{opacity:0;transform:translateY(14px)}}

/* ============ СЕКЦИИ ============ */
section{padding:clamp(54px,7vw,100px) clamp(18px,6vw,70px)}
.wrap{max-width:1200px;margin:0 auto}
.alt{background:var(--bg-alt);transition:background-color .45s}

.eyebrow{display:inline-flex;align-items:center;gap:11px;font-size:11px;font-weight:800;
  letter-spacing:2.4px;color:var(--blue);text-transform:uppercase}
html[data-theme="dark"] .eyebrow{color:#5fc8ee}
.eyebrow::before{content:"";width:28px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--cyan),var(--orange))}
h2{font-size:clamp(27px,4.3vw,44px);color:var(--dark);margin:14px 0 12px;
  letter-spacing:-1.2px;font-weight:900}
html[data-theme="dark"] h2{color:#eaf7ff}
.lead{color:var(--muted);font-size:15.5px;max-width:720px;margin:0 0 6px}

/* reveal */
.reveal{opacity:0;transform:translateY(30px);
  transition:opacity .75s cubic-bezier(.2,.7,.3,1),transform .75s cubic-bezier(.2,.7,.3,1)}
.reveal.in{opacity:1;transform:none}
.stagger > *:nth-child(1){transition-delay:.03s}
.stagger > *:nth-child(2){transition-delay:.09s}
.stagger > *:nth-child(3){transition-delay:.15s}
.stagger > *:nth-child(4){transition-delay:.21s}
.stagger > *:nth-child(5){transition-delay:.27s}
.stagger > *:nth-child(6){transition-delay:.33s}
.stagger > *:nth-child(7){transition-delay:.39s}
.stagger > *:nth-child(8){transition-delay:.45s}
.stagger > *:nth-child(9){transition-delay:.51s}

/* ============ О ПРОЕКТЕ ============ */
.intro-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(26px,5vw,60px);align-items:center;margin-top:14px}
.intro-grid p{color:var(--muted);font-size:15.5px}

.orbit{position:relative;aspect-ratio:1;max-width:400px;margin:0 auto;width:100%;
  display:grid;place-items:center}
.orbit-core{width:38%;height:38%;border-radius:50%;display:grid;place-items:center;font-size:clamp(30px,6vw,52px);
  background:linear-gradient(140deg,var(--blue),var(--cyan));color:#fff;
  box-shadow:0 0 0 14px rgba(41,182,230,.10),0 0 0 34px rgba(41,182,230,.06),
             0 24px 60px rgba(0,102,166,.35);animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-10px)}}
.orbit-ring{position:absolute;inset:0;animation:spin 26s linear infinite}
.orbit-ring span{position:absolute;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  font-size:23px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);
  animation:spinBack 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinBack{to{transform:rotate(-360deg)}}
.orbit-ring span:nth-child(1){top:-6px;left:50%;margin-left:-26px}
.orbit-ring span:nth-child(2){top:50%;right:-6px;margin-top:-26px}
.orbit-ring span:nth-child(3){bottom:-6px;left:50%;margin-left:-26px}
.orbit-ring span:nth-child(4){top:50%;left:-6px;margin-top:-26px}

/* ============ ПОТОК ЭНЕРГИИ ============ */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:38px;position:relative}
.flow::before{content:"";position:absolute;left:6%;right:6%;top:44px;height:2px;z-index:0;
  background:repeating-linear-gradient(90deg,var(--cyan) 0 12px,transparent 12px 24px);
  animation:dash 1.4s linear infinite;opacity:.55}
@keyframes dash{to{background-position:24px 0}}
.step{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:22px 16px;text-align:center;box-shadow:var(--shadow);
  transition:transform .35s,border-color .35s,box-shadow .35s}
.step:hover{transform:translateY(-6px);border-color:rgba(41,182,230,.55);box-shadow:var(--shadow-lg)}
.step .num{width:36px;height:36px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  font-weight:900;font-size:13.5px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 8px 20px rgba(0,102,166,.32)}
.step b{display:block;font-size:14.5px;color:var(--dark)}
html[data-theme="dark"] .step b{color:#dff3ff}
.step small{color:var(--muted);font-size:12px;line-height:1.5;display:block;margin-top:4px}

/* ============ КАРТОЧКИ ТИПОВ ============ */
.types-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:18px;margin-top:36px}
.type-card{position:relative;padding:26px 24px;border-radius:20px;background:var(--surface);
  border:1px solid var(--border);overflow:hidden;
  transition:transform .42s cubic-bezier(.2,.8,.3,1),box-shadow .42s,border-color .42s}
.type-card::before{content:"";position:absolute;inset:-1px;pointer-events:none;opacity:0;
  transition:opacity .4s;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,50%),rgba(41,182,230,.18),transparent 62%)}
.type-card:hover::before{opacity:1}
.type-card:hover{transform:translateY(-9px);border-color:rgba(41,182,230,.55);box-shadow:var(--shadow-lg)}
.tc-icon{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  margin-bottom:15px;border:1px solid rgba(41,182,230,.28);
  background:linear-gradient(140deg,rgba(0,102,166,.10),rgba(41,182,230,.22));
  transition:transform .42s cubic-bezier(.2,.8,.3,1)}
.type-card:hover .tc-icon{transform:scale(1.12) rotate(-6deg)}
.type-card h3{margin:0 0 8px;font-size:17.5px;color:var(--dark)}
html[data-theme="dark"] .type-card h3{color:#dff3ff}
.type-card p{margin:0;font-size:13.5px;color:var(--muted)}

/* ============ ВИДЕО ============ */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 34px}
.tab{padding:12px 22px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);font-weight:800;font-size:13px;transition:.3s}
.tab:hover{border-color:rgba(41,182,230,.6);color:var(--blue)}
.tab.active{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;
  border-color:transparent;box-shadow:0 12px 28px rgba(0,102,166,.32)}

.video-panel{display:none;animation:fadeUp .55s both}
.video-panel.active{display:block}
.video-layout{display:grid;grid-template-columns:minmax(260px,370px) 1fr;
  gap:clamp(24px,4vw,44px);align-items:start}

.video-frame{position:relative;width:100%;aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,#003B63,#0066A6 55%,#0a86b8);
  box-shadow:0 26px 60px rgba(0,59,99,.30);border:1px solid rgba(255,255,255,.12)}
.video-frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  background:#003B63}
.video-poster{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;
  gap:6px;text-align:center;color:#fff;padding:24px;
  background:radial-gradient(400px 300px at 50% 30%,rgba(41,182,230,.35),transparent 70%),
             linear-gradient(160deg,#003B63,#0066A6 60%,#0a86b8);
  transition:opacity .45s,visibility .45s}
.video-poster.hidden{opacity:0;visibility:hidden}
.vp-emoji{font-size:56px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3));animation:floaty 4.5s ease-in-out infinite}
.vp-title{font-size:19px;font-weight:900;letter-spacing:.4px;margin-top:8px}
.vp-sub{font-size:12.5px;color:#bfe4f6;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
.play-btn{width:74px;height:74px;border-radius:50%;border:0;margin-top:18px;font-size:24px;
  color:#fff;background:linear-gradient(135deg,#E66A25,#ff9248);padding-left:6px;
  box-shadow:0 16px 40px rgba(230,106,37,.5);transition:transform .3s,box-shadow .3s}
.play-btn:hover{transform:scale(1.09);box-shadow:0 22px 50px rgba(230,106,37,.65)}
.vp-hint{margin-top:14px;font-size:11.5px;color:#a9d5ea}

.note-block{background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:clamp(20px,3vw,30px);box-shadow:var(--shadow)}
.note-block h3{margin:0 0 14px;font-size:19px;color:var(--dark)}
html[data-theme="dark"] .note-block h3{color:#dff3ff}
.note-block > p{font-size:14px;color:var(--muted);margin:0 0 12px}
.note-item{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--border);font-size:13.5px;color:var(--muted)}
.note-item:first-of-type{border-top:0}
.note-item .ni-ico{flex:0 0 auto;font-size:16px;line-height:1.5}
.note-item b{color:var(--text)}
html[data-theme="dark"] .note-item b{color:#cfe9f7}

details{border:1px solid var(--border);border-radius:14px;padding:14px 17px;
  background:var(--surface-2);margin-top:12px;transition:border-color .3s,box-shadow .3s}
details[open]{border-color:rgba(41,182,230,.5);box-shadow:var(--shadow)}
summary{cursor:pointer;font-weight:800;font-size:13.5px;color:var(--blue);list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
html[data-theme="dark"] summary{color:#5fc8ee}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:19px;line-height:1;color:var(--cyan);transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{font-size:13px;color:var(--muted);margin:12px 0 0}

/* ============ ПРОФЕССИИ / ФАКТЫ ============ */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px}
.tile{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:26px 22px;overflow:hidden;transition:transform .4s,box-shadow .4s,border-color .4s}
.tile::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:150px;
  background:radial-gradient(closest-side,rgba(41,182,230,.20),transparent);opacity:0;transition:opacity .4s}
.tile:hover{transform:translateY(-8px);border-color:rgba(41,182,230,.55);box-shadow:var(--shadow-lg)}
.tile:hover::after{opacity:1}
.tile .t-ico{font-size:30px;margin-bottom:12px;display:block}
.tile b{display:block;font-size:15.5px;color:var(--dark);margin-bottom:6px}
html[data-theme="dark"] .tile b{color:#dff3ff}
.tile p{margin:0;font-size:13px;color:var(--muted)}

.stat-tile{text-align:center;padding:30px 18px}
.stat-tile b{font-size:clamp(30px,5vw,46px);font-weight:900;line-height:1;margin-bottom:10px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="dark"] .stat-tile b{background:linear-gradient(135deg,#7fe7ff,#29B6E6);
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* ============ БУДУЩЕЕ ============ */
.future{position:relative;overflow:hidden;color:#fff;isolation:isolate;
  background:linear-gradient(130deg,#00263f,#003B63 45%,#00527c 100%)}
.future::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(600px 420px at 88% 20%,rgba(41,182,230,.32),transparent 70%),
             radial-gradient(520px 380px at 6% 90%,rgba(230,106,37,.22),transparent 70%)}
.future-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,60px);align-items:center}
.future h2{color:#fff}
.future p{color:#cbe6f4;font-size:15.5px}
.future .eyebrow{color:#8bdcf5}
.future-art{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  border-radius:24px;padding:clamp(28px,5vw,46px);text-align:center;backdrop-filter:blur(10px);
  transition:transform .5s,background .5s}
.future-art:hover{transform:translateY(-6px);background:rgba(255,255,255,.11)}
.future-art .fa-ico{font-size:64px;line-height:1;animation:floaty 5s ease-in-out infinite}
.future-art h3{color:#fff;margin:18px 0 8px;font-size:19px}
.future-art p{color:#b9dcee;font-size:13px;margin:0}

/* ============ FOOTER ============ */
footer{padding:40px clamp(18px,6vw,70px) 30px;border-top:1px solid var(--border);background:var(--bg)}
.foot{display:flex;justify-content:space-between;align-items:flex-start;gap:22px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.foot .fbrand{font-weight:900;color:var(--blue);letter-spacing:.6px;font-size:16px}
html[data-theme="dark"] .foot .fbrand{color:#7fd4f5}
.foot small{color:var(--muted);font-size:12px}
.foot-links{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.foot-links a:hover{color:var(--orange)}
.line{height:5px;border-radius:8px;max-width:1200px;margin:24px auto 0;
  background:linear-gradient(90deg,var(--blue),var(--cyan),var(--orange))}
